[workspace]
resolver = "2"
members = [
    "crates/oura-cli",
    "crates/oura-ffi",
    "crates/oura-core",
    "crates/oura-summary",
    "crates/oura-dna",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_health"

[profile.release]
lto = true
strip = true

[patch."https://github.com/Th0rgal/open_oura"]
oura-store = { path = "vendor/oura-store" }
# Local: use our sibling open_oura fork (Windows BLE scan fix, history
# cold-start fix) instead of the pinned upstream rev.
oura-protocol = { path = "../open_oura/crates/oura-protocol" }
oura-link = { path = "../open_oura/crates/oura-link" }
