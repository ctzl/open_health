[workspace]
resolver = "2"
members = [
    "crates/oura-cli",
    "crates/oura-ffi",
    "crates/oura-core",
    "crates/oura-summary",
    "crates/oura-dna",
    "crates/ibi-correct",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_health"

[profile.release]
lto = true
strip = true

[patch."https://github.com/Th0rgal/open_oura"]
oura-store = { path = "vendor/oura-store" }
# Use our pushed open_oura fork (Windows BLE scan fix, history cold-start fix)
# instead of the pinned upstream rev. For local sibling development, temporarily
# switch these back to { path = "../open_oura/crates/..." }.
oura-protocol = { git = "https://github.com/ctzl/open_oura", rev = "ef001961506eb973500b462214af8a574712cd89" }
oura-link = { git = "https://github.com/ctzl/open_oura", rev = "ef001961506eb973500b462214af8a574712cd89" }
